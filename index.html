<!DOCTYPE html>

<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>贪吃蛇游戏</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <h1>贪吃蛇游戏</h1>
        <div class="game-info">
            <div class="score">分数: <span id="score">0</span></div>
            <div class="high-score">最高分: <span id="high-score">0</span></div>
        </div>
        <canvas id="game-board"></canvas>
        <div class="controls">
            <button id="start-btn">开始游戏</button>
            <button id="pause-btn">暂停</button>
            <button id="restart-btn">重新开始</button>
            <button id="theme-toggle">切换到暗色主题</button>
        </div>
        <div class="difficulty-controls">
            <button class="difficulty-btn" data-difficulty="easy">简单</button>
            <button class="difficulty-btn" data-difficulty="medium">中等</button>
            <button class="difficulty-btn" data-difficulty="hard">困难</button>
        </div>
        <div class="instructions">
            <p>使用方向键或WASD控制蛇的移动，空格键暂停/继续</p>
        </div>
        <div id="game-over" class="game-over">
            <h2>游戏结束!</h2>
            <p>你的分数: <span id="final-score">0</span></p>
            <button id="play-again">再来一局</button>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
